<script>
function stampNum(ctx,h,num){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.font='18px Georgia';ctx.fillStyle='#8a8580';
  ctx.fillText(num, 8, h-8);ctx.restore();
}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function ACCENT_LOCAL(){return '#8B5E3C';}

/* fig-086 -- q78: triangle rectangle, oposat/contigu per als DOS angles aguts A i B (angle recte a C). Moviment: construeix-per-definir. */
(function(){

  const A={x:0,y:280},B={x:400,y:280},C={x:85.28,y:116.17};

/* fig-089 -- q75: dos triangles diferents, mateixa area i perimetre. Moviment: contraexemple. */
(function(){
  const ctx=mk('i6',900,360),hd=makeHandDraw(ctx,6006);
  function drawTri(ox,oy,a,b,c,label){
    ctx.save();ctx.translate(ox,oy);
    const A={x:0,y:0}, B={x:c*4,y:0};
    const x = (c*c*16 + a*a*16 - b*b*16)/(2*c*4);
    const y2 = a*a*16-x*x;
    const y = -Math.sqrt(Math.max(0,y2));
    const C={x:x,y:y};
    hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.4,color:INK});
    hd.handSegment(A.x,A.y,C.x,C.y,{lineWidth:2.4,color:INK});
    hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:2.4,color:INK});
    lblC(ctx,label,(A.x+B.x+C.x)/3,40,ACCENT_LOCAL(),18);
    ctx.restore();
  }
  drawTri(40,260,17,25,28,'17, 25, 28');
  drawTri(480,260,20,21,29,'20, 21, 29');
  lblC(ctx,'totes dues: perímetre 70, àrea 210',450,320,ACCENT_LOCAL(),18);
  stampNum(ctx,340,'089');
})();
