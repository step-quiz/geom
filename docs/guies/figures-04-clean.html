<script>
function stampNum(ctx,h,num){ /* no-op */ }
// Cub en projecció cavallera -- reprès literalment de figures-03.html (mateix conveni,
// mateix vector de profunditat 0.3S,-0.2S en totes les figures amb cub d'aquest lot).
function cubeVerts(S,dx,dy){
  function P(x,y,z){return {x:x*S+z*dx, y:(1-y)*S+z*dy};}
  return {fBL:P(0,0,0),fBR:P(1,0,0),fTR:P(1,1,0),fTL:P(0,1,0),
          bBL:P(0,0,1),bBR:P(1,0,1),bTR:P(1,1,1),bTL:P(0,1,1)};
}
function drawCubeWire(hd,V,lw){
  lw=lw||2.6;
  const solid=[[V.fTL,V.fTR],[V.fTR,V.fBR],[V.fBR,V.fBL],[V.fBL,V.fTL],
    [V.fTL,V.bTL],[V.fTR,V.bTR],[V.fBR,V.bBR],[V.bTL,V.bTR],[V.bTR,V.bBR]];
  const hidden=[[V.fBL,V.bBL],[V.bTL,V.bBL],[V.bBL,V.bBR]];
  solid.forEach(s=>hd.handSegment(s[0].x,s[0].y,s[1].x,s[1].y,{lineWidth:lw,color:INK}));
  hidden.forEach(s=>hd.handSegment(s[0].x,s[0].y,s[1].x,s[1].y,{lineWidth:lw*0.85,dashed:true,dashPattern:[8,7],color:INK}));
}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function avg(pts){let x=0,y=0;pts.forEach(p=>{x+=p.x;y+=p.y});return {x:x/pts.length,y:y/pts.length};}
// Polígon regular de n costats, radi R, centre (cx,cy), primer vèrtex a angle a0 (rad).
function regularPoly(n,cx,cy,R,a0){
  const pts=[];
  for(let i=0;i<n;i++){const t=a0+i*2*Math.PI/n;pts.push({x:cx+R*Math.cos(t),y:cy+R*Math.sin(t)});}
  return pts;
}

/* fig-034 -- q01: on es el centre d'un triangle equilater (tres medianes) */
(function(){const ctx=mk('g1',480,460),hd=makeHandDraw(ctx,101),wid=460;ctx.translate(60,30);
 const Sd=360, h0=Sd*Math.sqrt(3)/2;
 const A=jit(hd,{x:Sd/2,y:0},380), B=jit(hd,{x:0,y:h0},380), C=jit(hd,{x:Sd,y:h0},380);
 const sAB=hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:3.2,color:INK});
 const sBC=hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:3.2,color:INK});
 const sCA=hd.handSegment(C.x,C.y,A.x,A.y,{lineWidth:3.2,color:INK});
 // medianes: de cada vertex al punt mitja REAL del costat oposat (pointAtT sobre el trac ja dibuixat)
 const Mab=sAB.pointAtT(0.5), Mbc=sBC.pointAtT(0.5), Mca=sCA.pointAtT(0.5);
 hd.handSegment(A.x,A.y,Mbc.x,Mbc.y,{dashed:true,lineWidth:2,dashPattern:[9,7],color:SANG});
 hd.handSegment(B.x,B.y,Mca.x,Mca.y,{dashed:true,lineWidth:2,dashPattern:[9,7],color:SANG});
 hd.handSegment(C.x,C.y,Mab.x,Mab.y,{dashed:true,lineWidth:2,dashPattern:[9,7],color:SANG});
 tick(hd,A.x,A.y,Mab.x,Mab.y);tick(hd,Mab.x,Mab.y,B.x,B.y);
 tick(hd,B.x,B.y,Mbc.x,Mbc.y);tick(hd,Mbc.x,Mbc.y,C.x,C.y);
 tick(hd,C.x,C.y,Mca.x,Mca.y);tick(hd,Mca.x,Mca.y,A.x,A.y);
 // NO forcem el punt de tall -- deixem que les tres quasi-coincideixin soles (Part 1.3/4.4)
 stampNum(ctx,wid,'034');})();

/* fig-038 -- q06: heptagon, diagonals des d'un vertex, angles marcats dos a dos */
(function(){const ctx=mk('g5',480,480),hd=makeHandDraw(ctx,66),wid=480;ctx.translate(60,70);
 const R=160, n=7;
 const P=regularPoly(n,R,R,R,-Math.PI/2-Math.PI/7);
 for(let i=0;i<n;i++)hd.handSegment(P[i].x,P[i].y,P[(i+1)%n].x,P[(i+1)%n].y,{lineWidth:2.8,color:INK});
 for(let i=2;i<n-1;i++)hd.handSegment(P[0].x,P[0].y,P[i].x,P[i].y,{dashed:true,lineWidth:1.8,dashPattern:[8,6],color:SANG});
 // angles al vertex 0: n-3=4 angles. Radis CRESCENTS perque els 4 arcs, tots amb centre al mateix
 // vertex, no es tapin entre ells (v. checklist: marques llegibles). Verificat numericament
 // (script Python a part): en un heptagon REGULAR aquests quatre angles son EXACTAMENT iguals
 // entre ells (angle inscrit: cada un subtén dues corDes consecutives del mateix poligon regular,
 // per tant el mateix arc de circumferencia) -- per aixo un sol arc a cadascun, els quatre iguals.
 angleMark(hd,P[0].x,P[0].y,P[1].x,P[1].y,P[2].x,P[2].y,26,1,SANG);
 angleMark(hd,P[0].x,P[0].y,P[2].x,P[2].y,P[3].x,P[3].y,42,1,SANG);
 angleMark(hd,P[0].x,P[0].y,P[3].x,P[3].y,P[4].x,P[4].y,58,1,SANG);
 angleMark(hd,P[0].x,P[0].y,P[4].x,P[4].y,P[5].x,P[5].y,74,1,SANG);
 stampNum(ctx,wid,'038');})();

/* fig-043 -- q76: cercle inscrit -- el triangle es 3 triangles amb el centre i el radi */
(function(){const ctx=mk('g10',520,420),hd=makeHandDraw(ctx,7676);ctx.translate(40,40);
 const A0={x:200,y:0}, B0={x:0,y:320}, C0={x:400,y:340};
 const A=jit(hd,A0,380), B=jit(hd,B0,380), C=jit(hd,C0,380);
 const sAB=hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:3,color:INK});
 const sBC=hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:3,color:INK});
 const sCA=hd.handSegment(C.x,C.y,A.x,A.y,{lineWidth:3,color:INK});
 // incentre REAL: mitjana ponderada (a*A+b*B+c*C)/(a+b+c) amb a,b,c = costats OPOSATS a A,B,C
 // -- calculat sobre els vertexs JA jitterats (A,B,C dibuixats), no els teorics A0,B0,C0.
 function d(p,q){return Math.hypot(p.x-q.x,p.y-q.y);}
 const a=d(B,C), b=d(C,A), c=d(A,B), per=a+b+c;
 const I={x:(a*A.x+b*B.x+c*C.x)/per, y:(a*A.y+b*B.y+c*C.y)/per};
 // peu de la perpendicular REAL des de I a cada costat (projeccio, no punt mitja)
 function foot(P,Q,X){const vx=Q.x-P.x,vy=Q.y-P.y,L2=vx*vx+vy*vy;
   const t=((X.x-P.x)*vx+(X.y-P.y)*vy)/L2; return {x:P.x+vx*t,y:P.y+vy*t};}
 const FAB=foot(A,B,I), FBC=foot(B,C,I), FCA=foot(C,A,I);
 hd.handSegment(I.x,I.y,FAB.x,FAB.y,{dashed:true,lineWidth:1.8,dashPattern:[7,6],color:SANG});
 hd.handSegment(I.x,I.y,FBC.x,FBC.y,{dashed:true,lineWidth:1.8,dashPattern:[7,6],color:SANG});
 hd.handSegment(I.x,I.y,FCA.x,FCA.y,{dashed:true,lineWidth:1.8,dashPattern:[7,6],color:SANG});
 hd.handSegment(I.x,I.y,A.x,A.y,{dashed:true,lineWidth:1.4,dashPattern:[6,5],color:SANG});
 hd.handSegment(I.x,I.y,B.x,B.y,{dashed:true,lineWidth:1.4,dashPattern:[6,5],color:SANG});
 hd.handSegment(I.x,I.y,C.x,C.y,{dashed:true,lineWidth:1.4,dashPattern:[6,5],color:SANG});
 rightAngle(hd,FAB.x,FAB.y,I.x,I.y,A.x,A.y,10);
 tick(hd,I.x,I.y,FAB.x,FAB.y);tick(hd,I.x,I.y,FBC.x,FBC.y);tick(hd,I.x,I.y,FCA.x,FCA.y);
 hd.handDot(I.x,I.y,4,SANG);
 lbl(ctx,'a',(B.x+C.x)/2-10,(B.y+C.y)/2+28,INK,24);
 lbl(ctx,'b',(C.x+A.x)/2+14,(C.y+A.y)/2,INK,24);
 lbl(ctx,'c',(A.x+B.x)/2-30,(A.y+B.y)/2-6,INK,24);
 lbl(ctx,'r',I.x+10,FBC.y-10,SANG,22);
 stampNum(ctx,420,'043');})();

/* fig-045 -- q89: si dues bisectrius d'angle son iguals, el triangle es isosceles? */
(function(){const ctx=mk('g12',560,400),hd=makeHandDraw(ctx,8989);ctx.translate(50,50);
 // triangle CLARAMENT NO isosceles a posta (es el que cal demostrar: encara aixi, si dues
 // bisectrius surten iguals, ES isosceles -- resultat de Steiner-Lehmus, contraintuitiu).
 // Angle a B obert a proposit (~70-80 graus) perque els dos arcs de la bisectriu es puguin
 // veure clarament separats -- amb un angle massa tancat un dels dos arcs queda aixafat.
 const A=jit(hd,{x:80,y:20},380), B=jit(hd,{x:0,y:320},380), C=jit(hd,{x:420,y:220},380);
 hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:3,color:INK});
 hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:3,color:INK});
 const sCA=hd.handSegment(C.x,C.y,A.x,A.y,{lineWidth:3,color:INK});
 // bisectriu des de B cap al costat CA -- interseccio real per la propietat de la bisectriu:
 // parteix CA en el punt P amb CP/PA = BC/BA (teorema de la bisectriu)
 function d(p,q){return Math.hypot(p.x-q.x,p.y-q.y);}
 const BC=d(B,C), BA=d(B,A);
 const tP = BC/(BC+BA); // fraccio des de C cap a A
 const P = sCA.pointAtT(1-tP); // sCA va de C a A; volem el punt a fraccio tP des de C
 hd.handSegment(B.x,B.y,P.x,P.y,{dashed:true,lineWidth:2,dashPattern:[8,6],color:SANG});
 angleMark(hd,B.x,B.y,A.x,A.y,P.x,P.y,32,1,SANG);
 angleMark(hd,B.x,B.y,P.x,P.y,C.x,C.y,32,1,SANG);
 lblC(ctx,'A',A.x,A.y-16,INK,24);lblC(ctx,'B',B.x+6,B.y+22,INK,24);lblC(ctx,'C',C.x+16,C.y+6,INK,24);
 stampNum(ctx,400,'045');})();

/* fig-046 -- q37: rectangle amb la mateixa area i el mateix perimetre que un triangle equilater */
(function(){const ctx=mk('g13',660,360),hd=makeHandDraw(ctx,3737);ctx.translate(50,40);
 const Sd=260, h0=Sd*Math.sqrt(3)/2;
 const A=jit(hd,{x:Sd/2,y:0},280), B=jit(hd,{x:0,y:h0},280), C=jit(hd,{x:Sd,y:h0},280);
 hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.8,color:INK});
 hd.handSegment(A.x,A.y,C.x,C.y,{lineWidth:2.8,color:INK});
 hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:2.8,color:INK});
 // rectangle al costat, dimensions NO donades numericament aqui (es la incognita que cal trobar) --
 // es dibuixa proporcionat pero sense pretendre ser el resultat exacte, en sanguina per marcar
 // que es la construccio que l'alumne ha de determinar.
 const ox=360, rw=220, rh=90;
 const rTL=jit(hd,{x:ox,y:h0-rh},260), rTR=jit(hd,{x:ox+rw,y:h0-rh},260),
       rBR=jit(hd,{x:ox+rw,y:h0},260), rBL=jit(hd,{x:ox,y:h0},260);
 hd.handSegment(rTL.x,rTL.y,rTR.x,rTR.y,{lineWidth:2.4,color:SANG});
 hd.handSegment(rTR.x,rTR.y,rBR.x,rBR.y,{lineWidth:2.4,color:SANG});
 hd.handSegment(rBR.x,rBR.y,rBL.x,rBL.y,{lineWidth:2.4,color:SANG});
 hd.handSegment(rBL.x,rBL.y,rTL.x,rTL.y,{lineWidth:2.4,color:SANG});
 lbl(ctx,'s',(A.x+B.x)/2-38,(A.y+B.y)/2,INK,24);
 lbl(ctx,'?',(rTL.x+rTR.x)/2-6,rTL.y-14,SANG,26);
 stampNum(ctx,360,'046');})();

/* fig-047 -- q39: area d'un pentagon regular -- 5 triangles isosceles des del centre (com q76+q29) */
(function(){const ctx=mk('g14',480,460),hd=makeHandDraw(ctx,3939),wid=480;ctx.translate(60,50);
 const R=170, n=5, cx=R, cy=R;
 const P=regularPoly(n,cx,cy,R,-Math.PI/2);
 for(let i=0;i<n;i++)hd.handSegment(P[i].x,P[i].y,P[(i+1)%n].x,P[(i+1)%n].y,{lineWidth:2.8,color:INK});
 for(let i=0;i<n;i++)hd.handSegment(cx,cy,P[i].x,P[i].y,{dashed:true,lineWidth:1.8,dashPattern:[8,6],color:SANG});
 // apotema cap al punt mitja d'un costat -- la peca nova que no hi era a q29 (alla nomes calien
 // diagonals per triangular; aqui cal l'apotema per convertir cada triangle en base x alcada/2)
 const sMid=hd.handSegment(P[0].x,P[0].y,P[1].x,P[1].y,{lineWidth:0.1,color:PAPER}); // reutilitzat nomes per pointAtT
 const M=sMid.pointAtT(0.5);
 hd.handSegment(cx,cy,M.x,M.y,{dashed:true,lineWidth:2,dashPattern:[7,6],color:SANG});
 rightAngle(hd,M.x,M.y,P[0].x,P[0].y,cx,cy,12);
 lbl(ctx,'R',cx+ (P[0].x-cx)/2+6, cy+(P[0].y-cy)/2-6,SANG,22);
 lbl(ctx,'apotema',cx+(M.x-cx)/2-6,cy+(M.y-cy)/2+22,SANG,18);
 stampNum(ctx,460,'047');})();

/* fig-048 -- q05: estrelles {5/2} i {8/3} -- angle a cada punta */
(function(){const ctx=mk('g15',800,380),hd=makeHandDraw(ctx,55);ctx.translate(40,40);
 // poligon estrellat {n/k}: connecta cada vertex i amb el vertex i+k (mod n), sense aixecar traç
 function starPts(n,k,cx,cy,R,a0){return regularPoly(n,cx,cy,R,a0);}
 function drawStar(hd,n,k,cx,cy,R,a0,col){
   const P=starPts(n,k,cx,cy,R,a0);
   for(let i=0;i<n;i++){const j=(i+k)%n;
     hd.handSegment(P[i].x,P[i].y,P[j].x,P[j].y,{lineWidth:2.6,color:col});}
   return P;
 }
 const P5=drawStar(hd,5,2,150,170,150,-Math.PI/2,INK);
 // angle marcat nomes a UNA punta (mostra el patró, no cal repetir-lo a les 5)
 // punta = vertex 0; els dos costats que hi arriben son (0->2) i (0->3) en sentit invers,
 // pero visualment el "pic" el formen el tram entrant (3->0) i el sortint (0->2)
 angleMark(hd,P5[0].x,P5[0].y,P5[3].x,P5[3].y,P5[2].x,P5[2].y,34,1,SANG);
 const ox=430;
 const P8=drawStar(hd,8,3,ox+150,170,150,-Math.PI/2,INK);
 angleMark(hd,P8[0].x,P8[0].y,P8[5].x,P8[5].y,P8[3].x,P8[3].y,34,1,SANG);
 stampNum(ctx,380,'048');})();

/* fig-050 -- q60: con inscrit en una semiesfera -- Cavalieri amb con complementari (com q54/q55).
   Seguint l'escaneig original (q60_page87): la semiesfera es representa amb DOS arcs el·liptics
   que comparteixen els mateixos dos punts extrems -- l'equador (el·lipse ampla i baixa, vist
   quasi de cantell) i la cupula (arc mes alt, per damunt) -- NO un cercle + mitja el·lipse. */
(function(){const ctx=mk('g17',600,400),hd=makeHandDraw(ctx,6060);ctx.translate(40,60);
 const rx=250, cy=260;
 const eqRy=42;      // aixafament de l'el·lipse de l'equador (vist quasi de cantell)
 const domeRy=250;   // alcada de la cupula (arc superior) -- similar al radi, com a l'escaneig
 // equador: el·lipse completa pero NOMES dibuixem la meitat de davant (part inferior visible)
 hd.handEllipse(rx,cy,rx,eqRy,{startAngle:0,endAngle:Math.PI,lineWidth:2.6,color:INK});
 // cupula: arc superior que va d'un extrem a l'altre de l'equador, pujant -- una el·lipse molt
 // mes alta que aixafada, de la qual només dibuixem la meitat de dalt
 hd.handEllipse(rx,cy,rx,domeRy,{startAngle:Math.PI,endAngle:2*Math.PI,lineWidth:2.6,color:INK});
 const apex={x:rx,y:cy-domeRy};
 const baseL={x:0,y:cy}, baseR={x:2*rx,y:cy};
 hd.handSegment(apex.x,apex.y,baseL.x,baseL.y,{lineWidth:2.8,color:INK});
 hd.handSegment(apex.x,apex.y,baseR.x,baseR.y,{lineWidth:2.8,color:INK});
 lbl(ctx,'R',rx+14,cy-domeRy/2,SANG,22);
 stampNum(ctx,400,'050');})();

 // octaedre: dos "piramides" quadrades unides per la base -- base = rombe en projeccio.

 hd.handSegment(oTop.x,oTop.y,oR.x,oR.y,{lineWidth:2.6,color:INK});
 hd.handSegment(oTop.x,oTop.y,oB.x,oB.y,{lineWidth:2,dashed:true,dashPattern:[7,6],color:INK});

 hd.handSegment(oBot.x,oBot.y,oR.x,oR.y,{lineWidth:2.6,color:INK});
