<script>
function stampNum(ctx,h,num){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.font='18px Georgia';ctx.fillStyle='#8a8580';
  ctx.fillText(num, 8, h-8);ctx.restore();
}
function cubeVerts(S,dx,dy){
  function P(x,y,z){return {x:x*S+z*dx, y:(1-y)*S+z*dy};}
  return {fBL:P(0,0,0),fBR:P(1,0,0),fTR:P(1,1,0),fTL:P(0,1,0),
          bBL:P(0,0,1),bBR:P(1,0,1),bTR:P(1,1,1),bTL:P(0,1,1)};
}
function drawCubeWire(hd,V,lw){
  lw=lw||2.6;
  const solid=[[V.fTL,V.fTR],[V.fTR,V.fBR],[V.fBR,V.fBL],[V.fBL,V.fTL],
    [V.fTL,V.bTL],[V.fTR,V.bTR],[V.fBR,V.bBR],[V.bTL,V.bTR],[V.bTR,V.bBR]];
  const hidden=[[V.fBL,V.bBL],[V.bTL,V.bBL],[V.bBL,V.bBR]];
  solid.forEach(s=>hd.handSegment(s[0].x,s[0].y,s[1].x,s[1].y,{lineWidth:lw,color:INK}));
  hidden.forEach(s=>hd.handSegment(s[0].x,s[0].y,s[1].x,s[1].y,{lineWidth:lw*0.85,dashed:true,dashPattern:[8,7],color:INK}));
}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function regularPoly(n,cx,cy,R,a0){
  const pts=[];
  for(let i=0;i<n;i++){const t=a0+i*2*Math.PI/n;pts.push({x:cx+R*Math.cos(t),y:cy+R*Math.sin(t)});}
  return pts;
}

/* ============================================================
   fig-070 -- q43: dos cercles solapats, cadascun pel centre de l'altre.
   Moviment: dues-maneres. */
(function(){

  const r=150, c1={x:0,y:150}, c2={x:r,y:150};
  hd.handEllipse(c1.x,c1.y,r,r,{lineWidth:2.6,irregularity:0.03,color:INK});
  hd.handEllipse(c2.x,c2.y,r,r,{lineWidth:2.6,irregularity:0.03,color:INK});
  const dy=Math.sqrt(r*r-(r/2)*(r/2));
  const Pt={x:r/2,y:150-dy}, Pb={x:r/2,y:150+dy};
  hd.handSegment(c1.x,c1.y,c2.x,c2.y,{lineWidth:1.8,dashed:true,dashPattern:[7,6],color:SANG});

  hd.handSegment(c2.x,c2.y,Pt.x,Pt.y,{lineWidth:1.8,color:SANG});
  tick(hd,c1.x,c1.y,c2.x,c2.y);tick(hd,c1.x,c1.y,Pt.x,Pt.y);tick(hd,c2.x,c2.y,Pt.x,Pt.y);
  hd.handDot(c1.x,c1.y,4,SANG);hd.handDot(c2.x,c2.y,4,SANG);hd.handDot(Pt.x,Pt.y,4,SANG);
  angleMark(hd,c1.x,c1.y,c2.x,c2.y,Pt.x,Pt.y,26,1,SANG);

/* ============================================================
   fig-071 -- q59: esfera inscrita en un cub.
   Moviment: redueix-al-conegut. */
(function(){
  const ctx=mk('h2',560,500),hd=makeHandDraw(ctx,5002);ctx.translate(60,100);
  // dx,dy reduïts respecte a la resta de cubs del kit: amb l'obliquitat original
  // la profunditat (davant-darrere) es comprimia molt mes que esquerra-dreta/amunt-avall,
  // i l'esfera (cercle+el·lipse) no podia ser tangent alhora a les 6 cares -- la tangencia
  // dreta acabava caient sobre l'aresta vertical en lloc del centre de la cara.
  // Amb dx,dy mes petits el cub es llegeix igual (profunditat suau) i el cercle de radi S/2
  // centrat al veritable centre 3D del cub (mitjana dels 4 vertexs, no del quadrat frontal)
  // es tangent EXACTE a les arestes esquerra/dreta (comprovat analiticament).
  const S=340,dx=0.3*S*0.5,dy=-0.2*S*0.5, V=cubeVerts(S,dx,dy);
  drawCubeWire(hd,V,2.6);
  const cx=(V.fBL.x+V.fTR.x+V.bBL.x+V.bTR.x)/4, cy=(V.fBL.y+V.fTR.y+V.bBL.y+V.bTR.y)/4, R=S/2;
  hd.handEllipse(cx,cy,R,R,{lineWidth:2.4,irregularity:0.03,color:INK,pinAngles:[0,Math.PI],pinSigma:0.4});
  hd.handEllipse(cx,cy,R,R*0.32,{lineWidth:1.6,irregularity:0.03,color:INK,pinAngles:[0,Math.PI],pinSigma:0.4});
  hd.handSegment(cx,cy,cx+R,cy,{lineWidth:1.8,dashed:true,dashPattern:[6,5],color:SANG});
  hd.handDot(cx,cy,4,SANG);
  lbl(ctx,'r',cx+R/2-6,cy-14,SANG,20);
  stampNum(ctx,460,'071');
})();

/* ============================================================
   fig-073 -- q63: dues maneres de generar un cilindre per moviment.
   Moviment: distingeix-casos. */
(function(){
  const ctx=mk('h4',900,420),hd=makeHandDraw(ctx,5004);

  (function(){
    ctx.save();ctx.translate(40,60);
    const r=70, rx=20, n=10, jitter=5, span=240, nFill=100;
    for(let i=0;i<nFill;i++){
      const x=r+hd.rand()*span;
      const dy=(hd.rand()-0.5)*jitter*0.6;
      const rrx=rx+(hd.rand()-0.5)*3, rry=r+(hd.rand()-0.5)*3;
      hd.handEllipse(x,r+dy,rrx,rry,{lineWidth:0.9,irregularity:0.03,color:SANG});
    }
    for(let i=0;i<n;i++){
      const dx=(hd.rand()-0.5)*jitter, dy=(hd.rand()-0.5)*jitter*0.6;
      const rrx=rx+(hd.rand()-0.5)*3, rry=r+(hd.rand()-0.5)*3;
      hd.handEllipse(r+dx,r+dy,rrx,rry,{lineWidth:1.4,irregularity:0.03,color:INK});
    }
    for(let i=0;i<n;i++){
      const dx=(hd.rand()-0.5)*jitter, dy=(hd.rand()-0.5)*jitter*0.6;
      const rrx=rx+(hd.rand()-0.5)*3, rry=r+(hd.rand()-0.5)*3;
      hd.handEllipse(r+span+dx,r+dy,rrx,rry,{lineWidth:1.4,irregularity:0.03,color:SANG});
    }
    lbl(ctx,'translació d\'un cercle',30,220,ACCENT_LOCAL(),20);
    ctx.restore();
  })();

  (function(){
    ctx.save();ctx.translate(480,40);
    const w=140,hgt=220,ax=0,axExt=hgt*0.1;
    quad(hd,ax,0,w,hgt,hgt,{lineWidth:2.4,color:INK});
    hd.handSegment(ax,-axExt,ax,hgt+axExt,{lineWidth:2,dashed:true,dashPattern:[6,5],color:SANG});
    // fletxa de gir
    const arcMid={x:ax+30,y:hgt/2};
    hd.handEllipse(ax,hgt/2,34,10,{startAngle:-1.6,endAngle:1.6,lineWidth:1.6,irregularity:0.05,color:SANG});
    lbl(ctx,'rotació d\'un rectangle',10,270,ACCENT_LOCAL(),20);
    ctx.restore();
  })();

  stampNum(ctx,400,'073');
})();
function ACCENT_LOCAL(){return '#8B5E3C';}

/* ============================================================
   fig-075 -- q50: con aproximat per discs apilats.
   Moviment: cas-limit. */
(function(){
  const ctx=mk('h6',520,575),hd=makeHandDraw(ctx,5006);ctx.translate(260,32);
  const R=190, H=480, n=7;
  // La silueta del con NO es dibuixa com a linia a part: emergeix
  // uniament de la concatenacio dels trams laterals de cada disc
  // (linies 165 endavant), ja que cadascun ja segueix exactament el
  // mateix cami recte del vertex a la vora. Dibuixar-la a més (com
  // abans) produia la "generatriu duplicada" que l'owner va notar.
  // Cada frontera y=i*H/n (i=0..n) es dibuixa UNA SOLA VEGADA -- abans el
  // bucle repetia cada frontera interna dues vegades (com a yBot d'un disc
  // i com a yTop del seguent), amb jitter independent cada cop, produint
  // les "circumferencies i generatrius duplicades" que l'owner va notar.
  // Igualment, cada tram lateral entre fronteres consecutives es dibuixa
  // una unica vegada.
  const ys=[]; for(let i=0;i<=n;i++) ys.push(i*H/n);
  for(let i=0;i<=n;i++){
    const y=ys[i], r=R*y/H;
    const col=(i===4)?SANG:INK;
    if(r>0.5) hd.handEllipse(0,y,r,r*0.22,{lineWidth:1.8,irregularity:0.03,color:col,
      pinAngles:[0,Math.PI],pinSigma:0.4});
  }
  for(let i=0;i<n;i++){
    const yTop=ys[i], yBot=ys[i+1];
    const rTop=R*yTop/H, rBot=R*yBot/H;
    const col=(i+1===4)?SANG:INK;
    hd.handSegment(-rTop,yTop,-rBot,yBot,{lineWidth:2.6,color:col});
    hd.handSegment(rTop,yTop,rBot,yBot,{lineWidth:2.6,color:col});
  }
  stampNum(ctx,555,'075');
})();

/* ============================================================
   fig-076 -- q57: tetraedre i octaedre, partits en piramides des del centre.

(function(){
  const ctx=mk('h7',740,480),hd=makeHandDraw(ctx,5007);ctx.translate(50,70);

  hd.handSegment(oB.x,oB.y,oL.x,oL.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oTop.x,oTop.y,oL.x,oL.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oTop.x,oTop.y,oF.x,oF.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oTop.x,oTop.y,oR.x,oR.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oTop.x,oTop.y,oB.x,oB.y,{lineWidth:2,dashed:true,dashPattern:[7,6],color:INK});
  hd.handSegment(oBot.x,oBot.y,oL.x,oL.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oBot.x,oBot.y,oF.x,oF.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oBot.x,oBot.y,oR.x,oR.y,{lineWidth:2.6,color:INK});
  hd.handSegment(oBot.x,oBot.y,oB.x,oB.y,{lineWidth:2,dashed:true,dashPattern:[7,6],color:INK});
  hd.handDot(cx,cy,4,SANG);
  [oL,oR,oF,oB,oTop,oBot].forEach(v=>hd.handSegment(cx,cy,v.x,v.y,{lineWidth:1.4,dashed:true,dashPattern:[4,4],color:SANG}));
  stampNum(ctx,440,'076');

/* ============================================================
   fig-077 -- q58: dos cilindres perpendiculars (solid de Steinmetz).
   Moviment: redueix-al-conegut (Cavalieri). */
(function(){
  const ctx=mk('h8',700,460),hd=makeHandDraw(ctx,5008);ctx.translate(60,60);
  const r=150;
  // cilindre horitzontal
  hd.handEllipse(0,r,r*0.32,r,{lineWidth:2.2,irregularity:0.03,rotation:0,color:INK});
  hd.handEllipse(480,r,r*0.32,r,{lineWidth:2.2,irregularity:0.03,color:INK});
  // cilindre vertical (creuat)
  const cx2=240;
  hd.handEllipse(cx2,0,r,r*0.32,{lineWidth:2.2,irregularity:0.03,color:INK});
  hd.handEllipse(cx2,300,r,r*0.32,{lineWidth:2.2,irregularity:0.03,color:INK});
  // Contorns dels cilindres (abans 4 segments negres continus, que feien
  // doble funció de generatriu del cilindre + vora del quadrat màxim de
  // secció): ara discontinus, perquè es vegin clarament com a REFERÈNCIA
  // (quadrat màxim, y=0/centre, costat = diàmetre 2r) i es puguin comparar
  // amb el tall vermell real (a yCut, per sobre del centre) sense that
  // quedin amagats sota un traç continu que ja hi passava per sobre.
  hd.handSegment(0,0,480,0,{lineWidth:1.3,dashed:true,dashPattern:[6,5],color:INK});
  hd.handSegment(0,2*r,480,2*r,{lineWidth:1.3,dashed:true,dashPattern:[6,5],color:INK});
  hd.handSegment(cx2-r,0,cx2-r,300,{lineWidth:1.3,dashed:true,dashPattern:[6,5],color:INK});
  hd.handSegment(cx2+r,0,cx2+r,300,{lineWidth:1.3,dashed:true,dashPattern:[6,5],color:INK});
  // pla de tall horitzontal (sanguina) marcant la seccio quadrada de la interseccio
  const yCut=r*0.55;
  const half=Math.sqrt(r*r-(r-yCut)*(r-yCut));
  const sq=[{x:cx2-half,y:r-half},{x:cx2+half,y:r-half},{x:cx2+half,y:r+half},{x:cx2-half,y:r+half}];
  for(let i=0;i<4;i++) hd.handSegment(sq[i].x,sq[i].y,sq[(i+1)%4].x,sq[(i+1)%4].y,{lineWidth:2,color:SANG});
  stampNum(ctx,420,'077');
})();

/* ============================================================
   fig-078 -- q61: esfera vs cilindre tancat que la circumscriu.
   Moviment: dues-maneres. */
(function(){
  const ctx=mk('h9',820,440),hd=makeHandDraw(ctx,5009);ctx.translate(60,60);
  const R=150;
  const sphereOutline=hd.handEllipse(R,R,R,R,{lineWidth:2.4,irregularity:0.03,color:INK});
  hd.handEllipse(R,R,R,R*0.3,{lineWidth:1.6,irregularity:0.03,rotation:-0.15,color:INK});
  // Radi real de l'esfera: segment des del centre fins a la vora del cercle
  // exterior (llegit amb pointAtAngle sobre el traç dibuixat, no la geometria
  // ideal), amb 'r' ancorada a aquest segment -- abans "r" era text flotant
  // sense cap marca que indiqués de quin radi es tractava.
  const rEndSphere=sphereOutline.pointAtAngle(-Math.PI/4);
  hd.handSegment(R,R,rEndSphere.x,rEndSphere.y,{lineWidth:1.8,color:INK});
  lbl(ctx,'r',191.7,80,INK,20);

  const ox=420, r2=R;
  const topEllipse=hd.handEllipse(ox+r2,0,r2,r2*0.28,{lineWidth:2.2,irregularity:0.03,color:INK});
  const botEllipse=hd.handEllipse(ox+r2,2*R,r2,r2*0.28,{lineWidth:2.2,irregularity:0.03,color:INK});
  // Alçada 2r: els dos segments verticals ara acaben EXACTAMENT sobre el
  // traç real de cada el·lipse (dalt i baix), no a les coordenades ideals
  // y=0/y=2R -- mateix patró d'incidència que fig-020.
  const topL=topEllipse.pointAtAngle(Math.PI), botL=botEllipse.pointAtAngle(Math.PI);
  const topR=topEllipse.pointAtAngle(0), botR=botEllipse.pointAtAngle(0);
  hd.handSegment(topL.x,topL.y,botL.x,botL.y,{lineWidth:2.4,color:INK});
  hd.handSegment(topR.x,topR.y,botR.x,botR.y,{lineWidth:2.4,color:INK});
  // Radi real del cilindre: segment des del centre de l'el·lipse superior
  // fins a la seva vora (mateix criteri que a l'esfera), amb 'r' ancorada.
  const rEndCyl=topEllipse.pointAtAngle(-Math.PI*0.65);
  hd.handSegment(ox+r2,0,rEndCyl.x,rEndCyl.y,{lineWidth:1.8,color:INK});
  lbl(ctx,'r',548,-46,INK,20);
  lbl(ctx,'2r',ox+2*r2+14,R,INK,20);
  stampNum(ctx,400,'078');
})();

/* ============================================================
   fig-079 -- q64: bastó que rellisca entre paret i terra -- l'envolupant.
   Moviment: cas-limit. */
(function(){
  const ctx=mk('h10',520,520),hd=makeHandDraw(ctx,5010);ctx.translate(40,40);
  const L=420, n=11;
  hd.handSegment(0,L,0,0,{lineWidth:2.6,wobble:1.0,color:INK});
  hd.handSegment(0,L,L,L,{lineWidth:2.6,wobble:1.0,color:INK});

    const t=(i/n)*(Math.PI/2);

    hd.handSegment(floorEnd.x,floorEnd.y,wallEnd.x,wallEnd.y,{lineWidth:1.6,wobble:1.32,color:(i===0||i===n)?INK:SANG});
  }
  lbl(ctx,'L',-34,L-60,INK,20);
  stampNum(ctx,480,'079');
})();

/* ============================================================
   fig-080 -- q65: rectangle girat al voltant d'un costat -> cilindre.
   Moviment: construeix-per-definir. */
(function(){
  const ctx=mk('h11',480,420),hd=makeHandDraw(ctx,5011);ctx.translate(60,60);
  const w=180,hgt=260;
  quad(hd,0,0,w,hgt,hgt,{lineWidth:2.6,color:INK});
  hd.handSegment(0,-16,0,hgt+16,{lineWidth:2,dashed:true,dashPattern:[6,5],color:INK});
  const cen={x:w,y:hgt/2};
