/* fig-084 -- q74: la desigualtat triangular -- dos arcs es toquen o no. Moviment: cas-limit. */
(function(){
  const ctx=mk('i1',900,340),hd=makeHandDraw(ctx,6001);
  (function(){
    // Triangle 3-4-5 REAL construit amb compas: base AB=5k (el costat mes llarg), arc de radi
    // 4k des de A i arc de radi 3k des de B; llur interseccio es el tercer vertex C. Amb aixo
    // el triangle es rectangle (angle recte a C), no equilater -- abans es dibuixava un triangle
    // equilater arbitrari sota l'etiqueta "3,4,5", cosa que no corresponia a la construccio real.
    ctx.save();ctx.translate(60,60);
    const k=44, a=3*k, b=4*k, c=5*k; // a=BC, b=AC, c=AB(base)
    const A={x:0,y:200},B={x:c,y:200};
    const cx=(b*b-a*a+c*c)/(2*c), cy=Math.sqrt(b*b-cx*cx);
    const C={x:cx,y:200-cy};
    hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.4,color:INK});
    // arc des de A, radi b=AC=176: nomes al voltant d'on arriba a C (no un semicercle sencer).
    // pinAngles:[angA] forca el radi a valer EXACTAMENT b just en direccio a C (v. hand-draw.js
    // linia 136-138: mecanisme pensat per a punts de contacte/tangencia) -- sense aixo, la
    // irregularitat normal del trac (irregularity:0.03) podia desviar l'arc prou perque no
    // arribes a tocar el vertex, sobretot amb un radi gran com aquest (176px).
    const angA=Math.atan2(C.y-A.y,C.x-A.x);
    hd.handEllipse(A.x,A.y,b,b,{startAngle:angA-0.35,endAngle:angA+0.35,lineWidth:1.8,irregularity:0.03,pinAngles:[angA],color:SANG});
    // arc des de B, radi a=BC=132 -- mateix mecanisme
    const angB=Math.atan2(C.y-B.y,C.x-B.x);
    hd.handEllipse(B.x,B.y,a,a,{startAngle:angB-0.35,endAngle:angB+0.35,lineWidth:1.8,irregularity:0.03,pinAngles:[angB],color:SANG});
    hd.handSegment(A.x,A.y,C.x,C.y,{lineWidth:2.2,color:INK});
    hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:2.2,color:INK});
    lblC(ctx,'3, 4, 5: hi ha intersecció',c/2,260,ACCENT_LOCAL(),18);
    ctx.restore();
  })();
  (function(){
    // Cas "no es toca": 1, 2, 10 -- exactament l'exemple de la Pista 1 de la guia q74 (abans es
    // feia servir 2,3,6, que no es l'exemple que la guia demana). Arcs de radi 1k i 2k des dels
    // extrems d'un segment de longitud 10k: com que 1k+2k=3k << 10k, els arcs no arriben a
    // acostar-se -- es veu clarament que NO es pot tancar cap triangle.
    ctx.save();ctx.translate(500,60);
    const k2=34, a2=1*k2, b2=2*k2, c2=10*k2;
    const A={x:0,y:200},B={x:c2,y:200};
    hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.4,color:INK});
    hd.handEllipse(A.x,A.y,a2,a2,{startAngle:-0.9,endAngle:0.9,lineWidth:1.8,irregularity:0.03,color:SANG});
    hd.handEllipse(B.x,B.y,b2,b2,{startAngle:Math.PI-0.9,endAngle:Math.PI+0.9,lineWidth:1.8,irregularity:0.03,color:SANG});
    // marca els centres des d'on es traca cada arc, tal com ha demanat l'owner
    hd.handDot(A.x,A.y,4,INK);hd.handDot(B.x,B.y,4,INK);
    lblC(ctx,'1, 2, 10: no hi ha intersecció',c2/2,260,ACCENT_LOCAL(),18);
    ctx.restore();
  })();
  stampNum(ctx,320,'084');
})();

/* fig-089 -- q75: dos triangles diferents, mateixa area i perimetre. Moviment: contraexemple. */
(function(){
  const ctx=mk('i6',900,420),hd=makeHandDraw(ctx,6006);
  // Escala augmentada (4->9): amb l'escala original els triangles nomes
  // ocupaven una franja petita del canvas, deixant mig canvas buit -- amb
  // costats reals fins a 29u, escala 9 aprofita be l'espai disponible.
  function drawTri(ox,oy,a,b,c,scale){
    ctx.save();ctx.translate(ox,oy);
    const A={x:0,y:0}, B={x:c*scale,y:0};
    const x = (c*c*scale*scale + a*a*scale*scale - b*b*scale*scale)/(2*c*scale);
    const y2 = a*a*scale*scale-x*x;
    const y = -Math.sqrt(Math.max(0,y2));
    const C={x:x,y:y};
    const AB=hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.4,color:INK});
    const AC=hd.handSegment(A.x,A.y,C.x,C.y,{lineWidth:2.4,color:INK});
    const BC=hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:2.4,color:INK});
    // Etiqueta de cada costat amb la seva mida real (no escalada),
    // desplaçada cap enfora del triangle. La direccio "cap enfora" es
    // determina comparant amb el centroide (no assumint un signe fix): el
    // vector perpendicular d'un segment canvia de signe segons quin dels
    // dos punts es P i quin es Q, així que un "s" fix no dona sempre cap
    // enfora als tres costats alhora (aixo produia el "17"/"20" quedant-se
    // dins el triangle).
    const centroid={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
    function sideLabel(P,Q,val){
      const mid=onSeg(P,Q,0.5);
      const dx=Q.x-P.x, dy=Q.y-P.y, len=Math.hypot(dx,dy);
      let nx=-dy/len, ny=dx/len; // perpendicular unitari (un dels 2 sentits)
      // si aquest sentit apunta CAP AL centroide, el girem
      const toCentroid={x:centroid.x-mid.x,y:centroid.y-mid.y};
      if (nx*toCentroid.x+ny*toCentroid.y>0){ nx=-nx; ny=-ny; }
      lblC(ctx, String(val), mid.x+nx*30, mid.y+ny*30, ACCENT_LOCAL(), 17);
    }
    sideLabel(A,B,c);
    sideLabel(A,C,b);
    sideLabel(B,C,a);
    lblC(ctx,'Perímetre = 70 u',(A.x+B.x)/2,68,ACCENT_LOCAL(),18);
    lblC(ctx,'Àrea = 210 u²',(A.x+B.x)/2,94,ACCENT_LOCAL(),18);
    ctx.restore();
  }
  drawTri(60,260,17,25,28,9);
  drawTri(480,260,20,21,29,9);
  stampNum(ctx,400,'089');
})();

  hd.handSegment(apex.x,apex.y,b2.x,b2.y,{lineWidth:2.6,color:INK});
  hd.handSegment(apex.x,apex.y,b3.x,b3.y,{lineWidth:2,dashed:true,dashPattern:[7,6],color:INK});
  const Medge=mid(b1,b2);
  // Els dos segments de l'angle diedre s'han de dibuixar amb precisio
  // gairebe de maquina (wobble/overshoot/passSpread/widthVariation a 0,
  // una sola passada), a diferencia de la resta de la figura -- aqui el
  // que importa es la mesura exacta de l'angle, no l'aspecte "a ma".
  const machinePrecision={wobble:0,passes:1,overshoot:0,passSpread:0,widthVariation:0,steps:2};
  hd.handSegment(Medge.x,Medge.y,apex.x,apex.y,{lineWidth:1.8,dashed:true,dashPattern:[5,5],color:SANG,...machinePrecision});
  hd.handSegment(Medge.x,Medge.y,b3.x,b3.y,{lineWidth:1.8,dashed:true,dashPattern:[5,5],color:SANG,...machinePrecision});
  angleMark(hd,Medge.x,Medge.y,apex.x,apex.y,b3.x,b3.y,30,1,SANG);
  stampNum(ctx,440,'096');
})();

/* fig-098 -- q90: quadrilater ciclic, partit per una diagonal. Moviment: redueix-al-conegut. */
(function(){
  const ctx=mk('i15',520,520),hd=makeHandDraw(ctx,6015);ctx.translate(260,260);
  const R=220;
  const angs=[-100,-10,60,190].map(a=>a*Math.PI/180);
  const P=angs.map(a=>({x:R*Math.cos(a),y:R*Math.sin(a)}));
  // pinAngles forca el radi de la circumferencia a valer EXACTAMENT R en les 4 direccions dels
  // vertexs -- sense aixo, la irregularitat normal del trac del cercle (i dels segments, tots
  // dos amb el seu propi jitter independent) podia deixar algun vertex just fora o dins del
  // trac de la circumferencia en lloc de tocar-lo (mateix mecanisme que a fig-084).
  hd.handEllipse(0,0,R,R,{lineWidth:2.2,irregularity:0.02,pinAngles:angs,color:INK});
  for(let i=0;i<4;i++) hd.handSegment(P[i].x,P[i].y,P[(i+1)%4].x,P[(i+1)%4].y,{lineWidth:2.4,color:INK});
  hd.handSegment(P[0].x,P[0].y,P[2].x,P[2].y,{lineWidth:2,dashed:true,dashPattern:[7,6],color:SANG});
  angleMark(hd,P[1].x,P[1].y,P[0].x,P[0].y,P[2].x,P[2].y,30,1,SANG);
  angleMark(hd,P[3].x,P[3].y,P[2].x,P[2].y,P[0].x,P[0].y,30,2,SANG);
  const labels=['a','b','c','d'];
  for(let i=0;i<4;i++){
    const mpt=mid(P[i],P[(i+1)%4]);
    const ext={x:mpt.x*1.14,y:mpt.y*1.14};
    lblC(ctx,labels[i],ext.x,ext.y,INK,20);
  }
  stampNum(ctx,500,'098');
})();
