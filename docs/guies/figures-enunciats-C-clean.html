<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
 body{margin:0;background:#fff}canvas{display:block;margin:0 0 24px 0}
</style></head><body>
<script src="../hand-draw.js"></script>
<script src="../comu.js"></script>
<script>
function stampNum(ctx,h,num){ /* no-op */ }
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function regularPoly(n,cx,cy,R,a0){
  const pts=[];
  for(let i=0;i<n;i++){const t=a0+i*2*Math.PI/n;pts.push({x:cx+R*Math.cos(t),y:cy+R*Math.sin(t)});}
  return pts;
}

/* ENUN-q82 -- un tetraedre i un octaedre junts (sense el folrat sencer). */
(function(){
  const ctx=mk('c1',680,420),hd=makeHandDraw(ctx,12001);
  (function(){ctx.save();ctx.translate(150,280);
    const b1={x:-90,y:0},b2={x:90,y:0},b3={x:0,y:-60},ap={x:10,y:-210};
    hd.handSegment(b1.x,b1.y,b2.x,b2.y,{lineWidth:2.4,color:INK});
    hd.handSegment(b2.x,b2.y,b3.x,b3.y,{lineWidth:2.4,dashed:true,dashPattern:[6,5],color:INK});
    hd.handSegment(b3.x,b3.y,b1.x,b1.y,{lineWidth:2.4,color:INK});
    hd.handSegment(ap.x,ap.y,b1.x,b1.y,{lineWidth:2.4,color:INK});
    hd.handSegment(ap.x,ap.y,b2.x,b2.y,{lineWidth:2.4,color:INK});
    hd.handSegment(ap.x,ap.y,b3.x,b3.y,{lineWidth:2.4,dashed:true,dashPattern:[6,5],color:INK});
    ctx.restore();})();
  (function(){ctx.save();ctx.translate(470,210);
    const R=110,L={x:-R,y:0},Rt={x:R,y:0},F={x:0,y:R*0.42},B={x:0,y:-R*0.42},T={x:0,y:-R-90},Bo={x:0,y:R+90};
    hd.handSegment(L.x,L.y,F.x,F.y,{lineWidth:2.4,color:INK});
    hd.handSegment(F.x,F.y,Rt.x,Rt.y,{lineWidth:2.4,color:INK});
    hd.handSegment(Rt.x,Rt.y,B.x,B.y,{lineWidth:2.4,dashed:true,dashPattern:[5,5],color:INK});
    hd.handSegment(B.x,B.y,L.x,L.y,{lineWidth:2.4,dashed:true,dashPattern:[5,5],color:INK});
    hd.handSegment(T.x,T.y,L.x,L.y,{lineWidth:2.4,color:INK});
    hd.handSegment(T.x,T.y,F.x,F.y,{lineWidth:2.4,color:INK});
    hd.handSegment(T.x,T.y,Rt.x,Rt.y,{lineWidth:2.4,color:INK});
    hd.handSegment(T.x,T.y,B.x,B.y,{lineWidth:2.4,dashed:true,dashPattern:[5,5],color:INK});
    hd.handSegment(Bo.x,Bo.y,L.x,L.y,{lineWidth:2.4,color:INK});
    hd.handSegment(Bo.x,Bo.y,F.x,F.y,{lineWidth:2.4,color:INK});
    hd.handSegment(Bo.x,Bo.y,Rt.x,Rt.y,{lineWidth:2.4,color:INK});
    hd.handSegment(Bo.x,Bo.y,B.x,B.y,{lineWidth:2.4,dashed:true,dashPattern:[5,5],color:INK});
    ctx.restore();})();
  stampNum(ctx,380,'164');
})();

/* ENUN-q83 -- cercle amb un angle de 60 graus marcat, neutre. */
(function(){
  const ctx=mk('c2',420,420),hd=makeHandDraw(ctx,12002);ctx.translate(210,210);
  const R=170;
  hd.handEllipse(0,0,R,R,{lineWidth:2.4,irregularity:0.03,color:INK});
  hd.handSegment(0,0,R,0,{lineWidth:2,color:INK});
  hd.handSegment(0,0,R*Math.cos(Math.PI/3),-R*Math.sin(Math.PI/3),{lineWidth:2,color:INK});
  angleMark(hd,0,0,R,0,R*Math.cos(Math.PI/3),-R*Math.sin(Math.PI/3),34,1,INK);
  stampNum(ctx,380,'165');
})();

/* ENUN-q85 -- pentagon regular amb un angle central de 72 graus marcat. */
(function(){
  const ctx=mk('c3',460,460),hd=makeHandDraw(ctx,12003);ctx.translate(230,240);
  const R=170;
  const pts=regularPoly(5,0,0,R,-Math.PI/2);
  for(let i=0;i<5;i++) hd.handSegment(pts[i].x,pts[i].y,pts[(i+1)%5].x,pts[(i+1)%5].y,{lineWidth:2.4,color:INK});
  hd.handSegment(0,0,pts[0].x,pts[0].y,{lineWidth:1.8,dashed:true,dashPattern:[6,5],color:INK});
  hd.handSegment(0,0,pts[1].x,pts[1].y,{lineWidth:1.8,dashed:true,dashPattern:[6,5],color:INK});
  angleMark(hd,0,0,pts[0].x,pts[0].y,pts[1].x,pts[1].y,30,1,INK);
  stampNum(ctx,400,'166');
})();

/* ENUN-q86 -- angle A, costat AB fixats; la segona longitud donada es
   mesura des de B (no des de A) sobre el segon rai -- aixo es
   exactament el parany de SSA. La figura d'ENUNCIAT mostra NOMES el
   que es dona (angle A + costat AB): l'arc centrat a B (la tecnica de
   resolucio -- compassar des de B) es reserva per a la guia, Pista 2
   (fig-016.png del lot de guies), no per aqui. */
(function(){
  const ctx=mk('c4',520,460),hd=makeHandDraw(ctx,12004);ctx.translate(60,300);
  const A={x:0,y:0}, B={x:280,y:-30};
  hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.6,color:INK});
  const ang=48*Math.PI/180;
  const dir={x:Math.cos(-ang),y:Math.sin(-ang)};
  hd.handSegment(A.x,A.y,A.x+dir.x*300,A.y+dir.y*300,{lineWidth:2.2,color:INK});
  angleMark(hd,A.x,A.y,B.x,B.y,A.x+dir.x*100,A.y+dir.y*100,30,1,INK);
  lbl(ctx,'A',A.x-26,A.y+8,INK,20);
  lbl(ctx,'B',B.x+14,B.y,INK,20);
  stampNum(ctx,340,'167');
})();

/* ENUN-q89 -- triangle escale net, sense bisectrius. */
(function(){
  const ctx=mk('c5',460,380),hd=makeHandDraw(ctx,12005);ctx.translate(60,60);
  const A={x:90,y:0},B={x:0,y:280},C={x:340,y:230};
  hd.handSegment(A.x,A.y,B.x,B.y,{lineWidth:2.6,color:INK});
  hd.handSegment(B.x,B.y,C.x,C.y,{lineWidth:2.6,color:INK});
  hd.handSegment(C.x,C.y,A.x,A.y,{lineWidth:2.6,color:INK});
  lblC(ctx,'A',A.x,A.y-18,INK,22);
  lblC(ctx,'B',B.x-18,B.y+10,INK,22);
  lblC(ctx,'C',C.x+18,C.y+10,INK,22);
  stampNum(ctx,340,'168');
})();

/* ENUN-q90 -- quadrilater ciclic amb a,b,c,d etiquetats, sense diagonal. */
(function(){
  const ctx=mk('c6',520,520),hd=makeHandDraw(ctx,12006);ctx.translate(260,260);
  const R=210;
  const angs=[-100,-10,60,190].map(a=>a*Math.PI/180);
  const circle=hd.handEllipse(0,0,R,R,{lineWidth:2.2,irregularity:0.02,color:INK});
  // Vertexs llegits del trac REAL de la circumferencia (pointAtAngle), no de
  // la formula ideal -- mateix patro d'incidencia que fig-015/020/060/061:
  // abans el vertex de dalt (comu a 'd' i 'a') queia lleugerament per sota
  // de la vora dibuixada.
  const P=angs.map(a=>circle.pointAtAngle(a));
  for(let i=0;i<4;i++) hd.handSegment(P[i].x,P[i].y,P[(i+1)%4].x,P[(i+1)%4].y,{lineWidth:2.4,color:INK});
  const labels=['a','b','c','d'];
  for(let i=0;i<4;i++){
    const mpt=mid(P[i],P[(i+1)%4]);
    const ext={x:mpt.x*1.14,y:mpt.y*1.14};
    lblC(ctx,labels[i],ext.x,ext.y,INK,20);
  }
  stampNum(ctx,480,'169');
})();

/* ENUN-q98 -- dos punxons i un fil, arc parcial (no l'el·lipse sencera). */
(function(){
  const ctx=mk('c7',520,340),hd=makeHandDraw(ctx,12007);ctx.translate(260,190);
  const F1={x:-90,y:0}, F2={x:90,y:0};
  hd.handDot(F1.x,F1.y,5,INK);
  hd.handDot(F2.x,F2.y,5,INK);
  const A=170,B=110;
  const t0=Math.PI*0.55, t1=t0+0.7*Math.PI;
  const arc=[];
  for(let i=0;i<=60;i++){const t=t0+i/60*(t1-t0); arc.push({x:A*Math.cos(t),y:B*Math.sin(t)});}
  for(let i=0;i<arc.length-1;i++) hd.handSegment(arc[i].x,arc[i].y,arc[i+1].x,arc[i+1].y,{lineWidth:2.2,color:INK});
  // el llapis: un punt REAL de l'arc (no una coordenada triada a part),
  // cap al mig del tram dibuixat -- evita el mateix bug d'incidencia
  // que ja ha calgut corregir diverses vegades en aquest projecte.
  const tP=t0+0.35*(t1-t0);
  const P={x:A*Math.cos(tP),y:B*Math.sin(tP)};
  hd.handSegment(F1.x,F1.y,P.x,P.y,{lineWidth:1.8,dashed:true,dashPattern:[5,4],color:INK});
  hd.handSegment(F2.x,F2.y,P.x,P.y,{lineWidth:1.8,dashed:true,dashPattern:[5,4],color:INK});
  hd.handDot(P.x,P.y,4,INK);
  lbl(ctx,'llapis',P.x-46,P.y+22,INK,17);
  stampNum(ctx,300,'170');
})();

/* ENUN-q100 -- projeccio central: punt O, dos plans paral·lels, un raig. */
(function(){
  const ctx=mk('c8',560,380),hd=makeHandDraw(ctx,12008);ctx.translate(60,60);
  const O={x:280,y:0};
  hd.handDot(O.x,O.y,5,INK);
  lbl(ctx,'O',O.x+10,O.y-10,INK,20);
  const pla1=hd.handSegment(0,140,440,150,{lineWidth:2.2,wobble:0.5,color:INK});
  hd.handSegment(0,260,440,272,{lineWidth:2.2,wobble:0.5,color:INK});
  const Px=pla1.pointAtT(0.34);
  hd.handSegment(O.x,O.y,O.x+(Px.x-O.x)*2.0, O.y+(Px.y-O.y)*2.0,{lineWidth:1.8,dashed:true,dashPattern:[6,5],color:INK});
  hd.handDot(Px.x,Px.y,4,INK);
  stampNum(ctx,340,'171');
})();

/* ENUN-q101 -- una recta amb 3 punts marcats, i una segona recta separada. */
(function(){
  const ctx=mk('c9',520,320),hd=makeHandDraw(ctx,12009);ctx.translate(50,60);
  const recta1=hd.handSegment(0,60,420,20,{lineWidth:2.4,wobble:0.5,color:INK});
  [0.15,0.5,0.8].forEach(t=>{
    const p=recta1.pointAtT(t);
    hd.handDot(p.x,p.y,4.5,INK);
  });
  hd.handSegment(30,220,440,180,{lineWidth:2.4,wobble:0.5,color:INK});
  stampNum(ctx,280,'172');
})();

/* ENUN-q104 -- tres rectes paral·leles. */
(function(){
  const ctx=mk('c10',460,320),hd=makeHandDraw(ctx,12010);ctx.translate(50,50);
  for(let i=0;i<3;i++) hd.handSegment(0,i*90,360,i*90,{lineWidth:2.4,color:INK});
  stampNum(ctx,270,'173');
})();

/* ENUN-q108 -- con de llum (llanterna) contra una paret, un sol angle. */
(function(){
  const ctx=mk('c11',560,680),hd=makeHandDraw(ctx,12011);ctx.translate(60,620);
  const T={x:0,y:0};
  hd.handDot(T.x,T.y,5,INK);
  lbl(ctx,'llanterna',T.x-20,T.y+26,INK,17);
  const wallX=420;
  // rajos definits per l'angle real (no per un vector arbitrari): es
  // garanteix que arriben fins a la paret perque es calculen fins a
  // x=wallX exactament, no per una llargada fixa que calia endevinar.
  const ang1=-55*Math.PI/180, ang2=-40*Math.PI/180;
  [ang1,ang2].forEach(a=>{
    const len = wallX/Math.cos(a);
    hd.handSegment(T.x,T.y,T.x+len*Math.cos(a),T.y+len*Math.sin(a),{lineWidth:2,wobble:0.5,color:INK});
  });
  hd.handSegment(wallX,-620,wallX,10,{lineWidth:2.6,wobble:0.5,color:INK});
  lbl(ctx,'paret',wallX+20,-350,INK,17);
  stampNum(ctx,640,'174');
})();

/* ENUN-q113 -- el·lipse amb a,b etiquetats. */
(function(){
  const ctx=mk('c12',480,340),hd=makeHandDraw(ctx,12012);ctx.translate(240,170);
  const A=190,B=110;
  const ell=[];
  for(let i=0;i<=200;i++){const t=i/200*2*Math.PI; ell.push({x:A*Math.cos(t),y:B*Math.sin(t)});}
  for(let i=0;i<ell.length-1;i++) hd.handSegment(ell[i].x,ell[i].y,ell[i+1].x,ell[i+1].y,{lineWidth:2.4,color:INK});
  hd.handSegment(0,0,A,0,{lineWidth:1.8,dashed:true,dashPattern:[6,5],color:INK});
  hd.handSegment(0,0,0,-B,{lineWidth:1.8,dashed:true,dashPattern:[6,5],color:INK});
  lbl(ctx,'a',A/2-6,20,INK,20);
  lbl(ctx,'b',10,-B/2,INK,20);
  stampNum(ctx,300,'175');
})();

/* ENUN-q116 -- hiperbola amb una sola tangent marcada en un punt. */
(function(){
  const ctx=mk('c13',620,520),hd=makeHandDraw(ctx,12013);ctx.translate(310,260);
  const a=110,b=130;
  function branch(sign){
    const pts=[];
    for(let i=-38;i<=38;i++){const t=i/30; pts.push({x:sign*a*Math.cosh(t),y:b*Math.sinh(t)});}
    return pts;
  }
  [branch(1),branch(-1)].forEach(pts=>{
    for(let i=0;i<pts.length-1;i++) hd.handSegment(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,{lineWidth:2.4,color:INK});
  });
  hd.handSegment(-230,-230*b/a,230,230*b/a,{lineWidth:1.6,dashed:true,dashPattern:[6,5],color:INK});
  hd.handSegment(-230,230*b/a,230,-230*b/a,{lineWidth:1.6,dashed:true,dashPattern:[6,5],color:INK});
  const t0=0.85;
  const Px=a*Math.cosh(t0), Py=b*Math.sinh(t0);
  const slope=(b*Math.cosh(t0))/(a*Math.sinh(t0));
  hd.handSegment(Px-35,Py-35*slope,Px+45.5,Py+45.5*slope,{lineWidth:2,wobble:0.6,color:SANG});
  hd.handDot(Px,Py,4,INK);
  stampNum(ctx,480,'176');
})();

/* ENUN-q126 -- un tor (donut), esquematic. */
(function(){
  const ctx=mk('c14',480,360),hd=makeHandDraw(ctx,12014);ctx.translate(240,180);
  const Ro=170, ri=70;
  hd.handEllipse(0,0,Ro,Ro*0.42,{lineWidth:2.4,irregularity:0.01,pinAngles:[0,Math.PI],color:INK});
  hd.handEllipse(0,0,ri,ri*0.42,{lineWidth:2.2,irregularity:0.03,color:INK});
  hd.handEllipse(-(Ro+ri)/2,0,(Ro-ri)/2,(Ro-ri)/2*0.9,{startAngle:0,endAngle:Math.PI,lineWidth:2.2,irregularity:0.01,pinAngles:[Math.PI],color:INK});
  hd.handEllipse((Ro+ri)/2,0,(Ro-ri)/2,(Ro-ri)/2*0.9,{startAngle:0,endAngle:Math.PI,lineWidth:2.2,irregularity:0.01,pinAngles:[0],color:INK});
  stampNum(ctx,320,'177');
})();

/* ENUN-q127 -- bastó contra paret i terra, mateixa convencio que q64. */
(function(){
  const ctx=mk('c15',420,420),hd=makeHandDraw(ctx,12015);ctx.translate(40,40);
  const L=320;
  hd.handSegment(0,L,0,0,{lineWidth:2.6,color:INK});
  hd.handSegment(0,L,L,L,{lineWidth:2.6,color:INK});
  const t=0.45*Math.PI/2;
  hd.handSegment(L*Math.cos(t),L,0,L-L*Math.sin(t),{lineWidth:2.6,color:INK});
  stampNum(ctx,380,'178');
})();
</script>
