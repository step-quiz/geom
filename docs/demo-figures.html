<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
 body{margin:0;background:#fff}canvas{display:block;margin:0 0 24px 0}
</style></head><body>
<script src="hand-draw.js"></script>
<script src="comu.js"></script>
<script>
function stampNum(ctx,h,num){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.font='16px Georgia';ctx.fillStyle='#8a8580';
  ctx.fillText(num, 8, h-8);ctx.restore();
}

/* ============================================================
   REDISSENY: cada panell es ara el seu propi canvas independent
   (15 en total, 5 per demo), no una tira compartida amb translate
   -- calia per poder referenciar-los un a un des de demos-dades.js
   (window.DEMOS[i].passos[n].figuraPanell), ara que cada pas es
   revela per separat (v. capçalera de demos-dades.js per que).
   panelLabel() ja NO s'usa: el text de cada pas viu nomes a les
   dades, mai incrustat a la imatge -- evita duplicar-lo en dos
   llocs que es podrien desincronitzar.

   Conveni de color (sense canvis): TINTA = el que ja hi havia en
   aquell panell; SANGUINA = el que s'acaba de CONSTRUIR en aquest
   mateix panell -- s'acumula panell a panell.
   ============================================================ */

/* ---------- demo-01: angle-sum ---------- */
(function(){
  const A={x:150,y:0}, B={x:0,y:260}, C={x:340,y:220};
  function triangle(hd,P,Q,R){
    hd.handSegment(P.x,P.y,Q.x,Q.y,{lineWidth:2.6,color:INK});
    hd.handSegment(P.x,P.y,R.x,R.y,{lineWidth:2.6,color:INK});
    hd.handSegment(Q.x,Q.y,R.x,R.y,{lineWidth:2.6,color:INK});
  }
  const dx=C.x-B.x, dy=C.y-B.y, norm=Math.hypot(dx,dy), ux=dx/norm, uy=dy/norm;
  const Lp={x:A.x-ux*130,y:A.y-uy*130}, Rp={x:A.x+ux*130,y:A.y+uy*130};
  const T1a={x:30,y:0}, T1b={x:0,y:320}, T1c={x:55,y:330}; // molt prim
  const T2a={x:260,y:40}, T2b={x:160,y:320}, T2c={x:420,y:320}; // gairebe equilater

  // panell 0: dos triangles que no s'assemblen gens
  (function(){
    const ctx=mk('d1p0',460,420),hd=makeHandDraw(ctx,7001);ctx.translate(20,50);
    triangle(hd,T1a,T1b,T1c);
    triangle(hd,T2a,T2b,T2c);
    stampNum(ctx,380,'demo-01-p0');
  })();

  // panell 1: nomes el triangle
  (function(){
    const ctx=mk('d1p1',420,380),hd=makeHandDraw(ctx,7002);ctx.translate(40,60);
    triangle(hd,A,B,C);
    stampNum(ctx,340,'demo-01-p1');
  })();

  // panell 2: + la linia auxiliar (sanguina -- acabada d'afegir)
  (function(){
    const ctx=mk('d1p2',420,380),hd=makeHandDraw(ctx,7003);ctx.translate(40,60);
    triangle(hd,A,B,C);
    hd.handSegment(Lp.x,Lp.y,Rp.x,Rp.y,{lineWidth:2,color:SANG});
    stampNum(ctx,340,'demo-01-p2');
  })();

  // panell 3: + els angles (sanguina)
  (function(){
    const ctx=mk('d1p3',420,380),hd=makeHandDraw(ctx,7004);ctx.translate(40,60);
    triangle(hd,A,B,C);
    hd.handSegment(Lp.x,Lp.y,Rp.x,Rp.y,{lineWidth:2,color:SANG});
    angleMark(hd,A.x,A.y,Lp.x,Lp.y,B.x,B.y,30,2,SANG);
    angleMark(hd,B.x,B.y,A.x,A.y,C.x,C.y,26,2,SANG);
    angleMark(hd,A.x,A.y,B.x,B.y,C.x,C.y,20,1,SANG);
    angleMark(hd,A.x,A.y,C.x,C.y,Rp.x,Rp.y,30,3,SANG);
    angleMark(hd,C.x,C.y,B.x,B.y,A.x,A.y,26,3,SANG);
    stampNum(ctx,340,'demo-01-p3');
  })();

  // panell 4: el MATEIX argument, sobre el triangle MOLT PRIM del panell 0
  (function(){
    const ctx=mk('d1p4',380,420),hd=makeHandDraw(ctx,7005);ctx.translate(30,50);
    triangle(hd,T1a,T1b,T1c);
    const pdx=T1c.x-T1b.x, pdy=T1c.y-T1b.y, pn=Math.hypot(pdx,pdy), pux=pdx/pn, puy=pdy/pn;
    const PLp={x:T1a.x-pux*100,y:T1a.y-puy*100}, PRp={x:T1a.x+pux*100,y:T1a.y+puy*100};
    hd.handSegment(PLp.x,PLp.y,PRp.x,PRp.y,{lineWidth:2,color:SANG});
    angleMark(hd,T1a.x,T1a.y,PLp.x,PLp.y,T1b.x,T1b.y,26,2,SANG);
    angleMark(hd,T1b.x,T1b.y,T1a.x,T1a.y,T1c.x,T1c.y,14,1,SANG);
    angleMark(hd,T1a.x,T1a.y,T1c.x,T1c.y,PRp.x,PRp.y,26,3,SANG);
    stampNum(ctx,380,'demo-01-p4');
  })();
})();

/* ---------- demo-02: isosceles median=altitude ---------- */
(function(){
  const A={x:150,y:0}, B={x:0,y:280}, C={x:300,y:280};
  const M={x:150,y:280};
  function triangle(hd,P,Q,R){
    hd.handSegment(P.x,P.y,Q.x,Q.y,{lineWidth:2.6,color:INK});
    hd.handSegment(P.x,P.y,R.x,R.y,{lineWidth:2.6,color:INK});
    hd.handSegment(Q.x,Q.y,R.x,R.y,{lineWidth:2.6,color:INK});
  }
  const Sa={x:70,y:0}, Sb={x:0,y:340}, Sc={x:140,y:340}; // agut
  const Oa={x:220,y:230}, Ob={x:60,y:340}, Oc={x:380,y:340}; // obtus, baix

  // panell 0: isosceles agut, isosceles obtus
  (function(){
    const ctx=mk('d2p0',460,420),hd=makeHandDraw(ctx,7011);ctx.translate(20,50);
    triangle(hd,Sa,Sb,Sc); tick(hd,Sa.x,Sa.y,Sb.x,Sb.y,INK); tick(hd,Sa.x,Sa.y,Sc.x,Sc.y,INK);
    triangle(hd,Oa,Ob,Oc); tick(hd,Oa.x,Oa.y,Ob.x,Ob.y,INK); tick(hd,Oa.x,Oa.y,Oc.x,Oc.y,INK);
    stampNum(ctx,380,'demo-02-p0');
  })();

  // panell 1: el triangle isosceles, tics marcats
  (function(){
    const ctx=mk('d2p1',420,380),hd=makeHandDraw(ctx,7012);ctx.translate(40,60);
    triangle(hd,A,B,C);
    tick(hd,A.x,A.y,B.x,B.y,INK); tick(hd,A.x,A.y,C.x,C.y,INK);
    stampNum(ctx,340,'demo-02-p1');
  })();

  // panell 2: + M i el segment AM
  (function(){
    const ctx=mk('d2p2',420,380),hd=makeHandDraw(ctx,7013);ctx.translate(40,60);
    triangle(hd,A,B,C);
    tick(hd,A.x,A.y,B.x,B.y,INK); tick(hd,A.x,A.y,C.x,C.y,INK);
    hd.handSegment(A.x,A.y,M.x,M.y,{lineWidth:2,color:SANG});
    hd.handDot(M.x,M.y,4,SANG);
    stampNum(ctx,340,'demo-02-p2');
  })();

  // panell 3: + l'angle recte a M
  (function(){
    const ctx=mk('d2p3',420,380),hd=makeHandDraw(ctx,7014);ctx.translate(40,60);
    triangle(hd,A,B,C);
    tick(hd,A.x,A.y,B.x,B.y,INK); tick(hd,A.x,A.y,C.x,C.y,INK);
    hd.handSegment(A.x,A.y,M.x,M.y,{lineWidth:2,color:SANG});
    hd.handDot(M.x,M.y,4,SANG);
    rightAngle(hd,M.x,M.y,A.x,A.y,C.x,C.y,16,SANG);
    stampNum(ctx,340,'demo-02-p3');
  })();

  // panell 4: el mateix argument sobre l'isosceles molt agut del panell 0
  (function(){
    const ctx=mk('d2p4',420,420),hd=makeHandDraw(ctx,7015);ctx.translate(40,60);
    const Sm={x:(Sb.x+Sc.x)/2, y:(Sb.y+Sc.y)/2};
    triangle(hd,Sa,Sb,Sc); tick(hd,Sa.x,Sa.y,Sb.x,Sb.y,INK); tick(hd,Sa.x,Sa.y,Sc.x,Sc.y,INK);
    hd.handSegment(Sa.x,Sa.y,Sm.x,Sm.y,{lineWidth:2,color:SANG});
    hd.handDot(Sm.x,Sm.y,4,SANG);
    rightAngle(hd,Sm.x,Sm.y,Sa.x,Sa.y,Sc.x,Sc.y,14,SANG);
    stampNum(ctx,380,'demo-02-p4');
  })();
})();

/* ---------- demo-03: four triangles from midpoints ---------- */
(function(){
  const A={x:150,y:0}, B={x:0,y:260}, C={x:300,y:260};
  function triangle(hd,P,Q,R,opts){
    hd.handSegment(P.x,P.y,Q.x,Q.y,opts||{lineWidth:2.6,color:INK});
    hd.handSegment(P.x,P.y,R.x,R.y,opts||{lineWidth:2.6,color:INK});
    hd.handSegment(Q.x,Q.y,R.x,R.y,opts||{lineWidth:2.6,color:INK});
  }
  const D={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
  const E={x:(B.x+C.x)/2,y:(B.y+C.y)/2};
  const F={x:(C.x+A.x)/2,y:(C.y+A.y)/2};

  // panell 0: els quatre triangles resultants, ja separats i UN capgirat
  (function(){
    const ctx=mk('d3p0',460,420),hd=makeHandDraw(ctx,7021);ctx.translate(20,50);
    const s=95;
    triangle(hd,{x:0,y:s},{x:s,y:s},{x:s/2,y:0},{lineWidth:2.2,color:SANG});
    triangle(hd,{x:150,y:s},{x:150+s,y:s},{x:150+s/2,y:0},{lineWidth:2.2,color:SANG});
    triangle(hd,{x:75,y:s+30},{x:75+s,y:s+30},{x:75+s/2,y:2*s+30},{lineWidth:2.2,color:SANG});
    stampNum(ctx,380,'demo-03-p0');
  })();

  // panell 1: nomes el triangle
  (function(){
    const ctx=mk('d3p1',420,380),hd=makeHandDraw(ctx,7022);ctx.translate(40,60);
    triangle(hd,A,B,C);
    stampNum(ctx,340,'demo-03-p1');
  })();

  // panell 2: + D, E, F
  (function(){
    const ctx=mk('d3p2',420,380),hd=makeHandDraw(ctx,7023);ctx.translate(40,60);
    triangle(hd,A,B,C);
    [D,E,F].forEach(p=>hd.handDot(p.x,p.y,4,INK));
    stampNum(ctx,340,'demo-03-p2');
  })();

  // panell 3: + els tres segments (sanguina)
  (function(){
    const ctx=mk('d3p3',420,380),hd=makeHandDraw(ctx,7024);ctx.translate(40,60);
    triangle(hd,A,B,C);
    [D,E,F].forEach(p=>hd.handDot(p.x,p.y,4,INK));
    hd.handSegment(D.x,D.y,E.x,E.y,{lineWidth:2,color:SANG});
    hd.handSegment(E.x,E.y,F.x,F.y,{lineWidth:2,color:SANG});
    hd.handSegment(F.x,F.y,D.x,D.y,{lineWidth:2,color:SANG});
    stampNum(ctx,340,'demo-03-p3');
  })();

  // panell 4: el mateix argument sobre un triangle molt obtus/aixafat
  (function(){
    const ctx=mk('d3p4',420,380),hd=makeHandDraw(ctx,7025);ctx.translate(40,60);
    const Qa={x:120,y:60}, Qb={x:0,y:280}, Qc={x:340,y:280};
    const QD={x:(Qa.x+Qb.x)/2,y:(Qa.y+Qb.y)/2};
    const QE={x:(Qb.x+Qc.x)/2,y:(Qb.y+Qc.y)/2};
    const QF={x:(Qc.x+Qa.x)/2,y:(Qc.y+Qa.y)/2};
    triangle(hd,Qa,Qb,Qc);
    [QD,QE,QF].forEach(p=>hd.handDot(p.x,p.y,4,INK));
    hd.handSegment(QD.x,QD.y,QE.x,QE.y,{lineWidth:2,color:SANG});
    hd.handSegment(QE.x,QE.y,QF.x,QF.y,{lineWidth:2,color:SANG});
    hd.handSegment(QF.x,QF.y,QD.x,QD.y,{lineWidth:2,color:SANG});
    stampNum(ctx,340,'demo-03-p4');
  })();
})();
</script>
</body></html>
